<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SignBridge</title>

    <!--
      Decides "phone" (simulator frame) vs "window" (plain full-bleed app) before
      anything paints, so there's no flash of the wrong layout on load. Priority:
      1. An explicit choice the person already made with the toggle button below
         (persisted in localStorage) — sticks regardless of window size.
      2. Otherwise, auto: phone frame above 700px viewport width (desktop/tablet —
         wide enough that a real device wouldn't be viewed at that size), plain
         full-bleed at or below it (an actual phone, where nobody wants a shrunk-
         down fake phone drawn on top of their real one).
      The resize listener keeps case 2 responsive to window resizing; it's a no-op
      once an explicit choice exists; see this file's <script> at the end of <body>
      for what "explicit" is written by, and its own top comment for more.
    -->
    <script>
      (function () {
        var STORAGE_KEY = 'signbridge-view-mode';
        function explicitMode() {
          try {
            var stored = localStorage.getItem(STORAGE_KEY);
            return stored === 'phone' || stored === 'window' ? stored : null;
          } catch (error) {
            return null;
          }
        }
        function autoMode() {
          return window.innerWidth > 700 ? 'phone' : 'window';
        }
        function applyMode() {
          document.documentElement.setAttribute(
            'data-view-mode',
            explicitMode() || autoMode(),
          );
        }
        applyMode();
        window.addEventListener('resize', function () {
          if (!explicitMode()) {
            applyMode();
          }
        });
      })();
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element
         Kept as-is; it still governs #root's own box, it's just that #root now lives
         inside .phone-screen (the simulator's "glass") instead of directly in body
         when data-view-mode="phone". -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      Wraps the app in an iPhone-style simulator frame when
      html[data-view-mode="phone"] (the default on desktop/tablet widths — see the
      script above) — this is purely a presentational shell around the same #root
      the RN Web app always mounted into; nothing about the app itself changes.
      html[data-view-mode="window"] strips all of this back out to the plain
      full-bleed layout the app always had before this shell existed.
    -->
    <style id="simulator-shell">
      html[data-view-mode='phone'] body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        box-sizing: border-box;
        padding: 32px 16px;
        background: radial-gradient(circle at 50% 0%, #2a3a34 0%, #121815 60%, #0a0d0b 100%);
      }

      html[data-view-mode='phone'] .phone-frame {
        position: relative;
        width: min(430px, 92vw);
        aspect-ratio: 9 / 19.5;
        max-height: calc(100vh - 64px);
        border-radius: 54px;
        background: linear-gradient(155deg, #3a3a3c, #161618 55%, #050505);
        padding: 14px;
        box-sizing: border-box;
        box-shadow:
          0 40px 80px -30px rgba(0, 0, 0, 0.65),
          0 0 0 2px rgba(255, 255, 255, 0.06) inset,
          0 0 0 1px rgba(0, 0, 0, 0.4);
        flex-shrink: 0;
      }

      html[data-view-mode='phone'] .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 40px;
        overflow: hidden;
        background: #000;
        isolation: isolate;
      }

      /* The #root rule above already gives it height:100%/flex:1 — inside
         .phone-screen (data-view-mode="phone") that means "fill the simulated
         screen"; in "window" mode .phone-frame/.phone-screen get no sizing rules
         at all below, so #root's height:100%/flex:1 instead fills body directly,
         exactly like before this shell existed. */

      html[data-view-mode='phone'] .phone-notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 38%;
        max-width: 172px;
        height: 26px;
        background: #000;
        border-radius: 0 0 18px 18px;
        z-index: 20;
        pointer-events: none;
      }

      html[data-view-mode='phone'] .phone-home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 34%;
        max-width: 140px;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.55);
        z-index: 20;
        pointer-events: none;
      }

      html[data-view-mode='phone'] .phone-button {
        position: absolute;
        background: linear-gradient(90deg, #050505, #2a2a2c);
        border-radius: 3px;
      }
      html[data-view-mode='phone'] .phone-button--power {
        right: -3px;
        top: 22%;
        width: 3px;
        height: 90px;
      }
      html[data-view-mode='phone'] .phone-button--volume-up {
        left: -3px;
        top: 18%;
        width: 3px;
        height: 55px;
      }
      html[data-view-mode='phone'] .phone-button--volume-down {
        left: -3px;
        top: 27%;
        width: 3px;
        height: 55px;
      }

      /* The message-composer text box, shrunk down for the simulator's tighter
         screen. Targeted by tag inside .phone-frame rather than one of RN Web's
         own generated classes (those are content-hashed and can change on any
         rebuild) -- this only ever matches the one <textarea> the composer
         renders, and only while data-view-mode="phone", so "window" mode keeps
         the composer's normal, unmodified size. !important because RN Web's own
         atomic classes set height with a plain class selector of their own; this
         selector already outranks a single class on specificity alone, but the
         two together are setting the exact same property, so !important removes
         any doubt about which one wins. min-height is set alongside height for
         the same reason height alone didn't work at first: the app also sets its
         own min-height (52px, from COMPOSER.minHeight in constants/layout.ts) on
         this element, and CSS always uses the larger of the two when they
         conflict -- overriding height without also overriding min-height left
         the box pinned at 52px regardless of what height said. */
      /* Composer textarea: capped to a compact 52px box in both view modes --
         real devices always land in "window" mode by default (see the auto-detect
         script up top), so this ended up wanted there too, not just in the
         simulator. Without an explicit height here the browser falls back to
         sizing the box off its rows="5" attribute (~129px), which is *taller*
         than the app's own min-height: 52px (COMPOSER.minHeight in
         constants/layout.ts) and so silently wins over it -- min-height only ever
         applies when it's the larger of the two, and intrinsic rows-based sizing
         with no CSS height at all isn't bound by it. Padding is zeroed because
         52px is barely more than this element's own 16px+16px padding + 2px
         border added together, leaving almost no room for a line of text
         otherwise; align-items: center keeps the (now unpadded) text/placeholder
         looking vertically centered rather than pinned to the top edge. */
      html[data-view-mode='phone'] .phone-frame textarea,
      html[data-view-mode='window'] .phone-frame textarea {
        height: 52px !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        display: flex !important;
        align-items: center !important;
      }

      /* Simulator-only extra breathing room below the composer -- window mode
         (including real devices) keeps its original spacing here. */
      html[data-view-mode='phone'] .phone-frame textarea {
        margin-bottom: 12px !important;
      }

      /* In "window" mode, none of the .phone-* elements get any styling above, so
         they render as plain block <div>s stacked in the normal flow around
         #root. .phone-frame/.phone-screen specifically need width/height:100% so
         #root (height:100%/flex:1 from expo-reset, but only actually flexing when
         its parent is itself a flex container -- it isn't here) has something
         non-zero to fill; a block box defaults its own width to 100% of its
         parent already, so only height needs stating explicitly, but pinning
         both here removes any doubt. display is deliberately left alone (plain
         "block", the same as before this shell existed) -- making .phone-frame a
         flex container here (an earlier version of this rule did) turned
         .phone-screen into a flex *item* with no flex-basis, collapsing it to
         width: 0 instead of the 100% a plain block child gets automatically. */
      html[data-view-mode='window'] .phone-frame,
      html[data-view-mode='window'] .phone-screen {
        width: 100%;
        height: 100%;
      }
      html[data-view-mode='window'] .phone-notch,
      html[data-view-mode='window'] .phone-home-indicator,
      html[data-view-mode='window'] .phone-button {
        display: none;
      }

      /* The view-mode toggle button itself — shown in both modes, fixed to the
         viewport (so it isn't affected by the phone frame's own box) in the
         corner least likely to sit on top of anything the app renders there. */
      .view-mode-toggle {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        background: rgba(20, 20, 22, 0.55);
        backdrop-filter: blur(6px);
        color: #fff;
        font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        cursor: pointer;
        line-height: 1;
      }
      .view-mode-toggle:hover {
        background: rgba(20, 20, 22, 0.75);
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <button
      id="view-mode-toggle"
      class="view-mode-toggle"
      type="button"
      aria-label="Switch between simulator and window view"
    >
      <span id="view-mode-toggle-icon" aria-hidden="true">📱</span>
      <span id="view-mode-toggle-label">Simulator</span>
    </button>

    <div class="phone-frame">
      <div class="phone-button phone-button--power"></div>
      <div class="phone-button phone-button--volume-up"></div>
      <div class="phone-button phone-button--volume-down"></div>
      <div class="phone-screen">
        <!-- The root element for your Expo app. -->
        <div id="root"></div>
        <div class="phone-notch"></div>
        <div class="phone-home-indicator"></div>
      </div>
    </div>

    <!--
      Wires up the toggle button. Deliberately separate from the head script above:
      that one only ever needs to run once, synchronously, before paint; this one
      needs the button element to exist, so it runs from here at the point the
      parser reaches it (the button markup above it is already in the DOM by then —
      no need to wait for DOMContentLoaded).
    -->
    <script>
      (function () {
        var STORAGE_KEY = 'signbridge-view-mode';
        var button = document.getElementById('view-mode-toggle');
        var icon = document.getElementById('view-mode-toggle-icon');
        var label = document.getElementById('view-mode-toggle-label');

        function currentMode() {
          return (
            document.documentElement.getAttribute('data-view-mode') || 'phone'
          );
        }
        function render() {
          var mode = currentMode();
          icon.textContent = mode === 'phone' ? '📱' : '🖥️';
          label.textContent = mode === 'phone' ? 'Simulator' : 'Window';
        }
        render();

        button.addEventListener('click', function () {
          var next = currentMode() === 'phone' ? 'window' : 'phone';
          document.documentElement.setAttribute('data-view-mode', next);
          try {
            localStorage.setItem(STORAGE_KEY, next);
          } catch (error) {
            // No localStorage (private mode, etc.) — the toggle still works for
            // this page view, it just won't be remembered on the next reload.
          }
          render();
        });
      })();
    </script>
  <script src="_expo/static/js/web/index-9982b26e0e8304794712a5aa7efee6c6.js" defer></script>
</body>
</html>
